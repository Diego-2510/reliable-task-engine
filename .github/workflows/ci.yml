name: CI
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: task
          POSTGRES_PASSWORD: task
          POSTGRES_DB: task_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U task -d task_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://task:task@localhost:5432/task_test
      TEST_DATABASE_URL: postgresql+psycopg://task:task@localhost:5432/task_test
      TEST_DATABASE: '1'
      BENCHMARK_DATABASE: '1'
      BENCHMARK_DATABASE_URL: postgresql+psycopg://task:task@localhost:5432/rte_benchmark_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.17'
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run ruff check .
      - run: uv run mypy src
      - name: Create separate disposable benchmark smoke database
        run: |
          uv run python - <<'PYTHON'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["TEST_DATABASE_URL"], hide_parameters=True)
          with engine.connect().execution_options(isolation_level="AUTOCOMMIT") as connection:
              assert connection.scalar(text("SELECT current_database()")) == "task_test"
              connection.execute(text("CREATE DATABASE rte_benchmark_test"))
          engine.dispose()
          PYTHON
      - run: uv run pytest
