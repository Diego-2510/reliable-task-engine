name: rte-benchmark
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark
      POSTGRES_DB: rte_benchmark_test
    ports: ["127.0.0.1:${BENCHMARK_PORT:-55452}:5432"]
    command: ["postgres", "-c", "fsync=on", "-c", "synchronous_commit=on"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d rte_benchmark_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: ["benchmark-data:/var/lib/postgresql/data"]
volumes:
  benchmark-data:
    labels:
      reliable-task-engine.benchmark: "1"
