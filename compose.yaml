services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: task
      POSTGRES_PASSWORD: task
      POSTGRES_DB: task
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task -d task"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: ["pgdata:/var/lib/postgresql/data"]
  migrate:
    build: .
    environment: &env
      DATABASE_URL: postgresql+psycopg://task:task@db:5432/task
      TASK_ENGINE_TELEMETRY: ${TASK_ENGINE_TELEMETRY:-disabled}
      TASK_ENGINE_LOG_FORMAT: ${TASK_ENGINE_LOG_FORMAT:-human}
    depends_on:
      db: {condition: service_healthy}
    command: ["alembic", "upgrade", "head"]
  api:
    build: .
    environment: *env
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: ["127.0.0.1:8000:8000"]
  worker:
    build: .
    environment:
      <<: *env
      LEASE_SECONDS: ${LEASE_SECONDS:-60}
    depends_on:
      migrate: {condition: service_completed_successfully}
    command: ["python", "-m", "task_engine.worker"]
  dispatcher:
    build: .
    environment:
      <<: *env
      DELIVERY_LEASE_SECONDS: ${DELIVERY_LEASE_SECONDS:-60}
    depends_on:
      migrate: {condition: service_completed_successfully}
    command: ["python", "-m", "task_engine.dispatcher"]
volumes:
  pgdata:
